name: Shadow Crystal - Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

env:
  HAXE_VERSION: "4.3.7"
  JAVA_VERSION: "17"

  # Android versions taken from the FNF mobile build guide.
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_PLATFORM: "35"
  ANDROID_MIN_PLATFORM: "29"
  ANDROID_NDK: "29.0.13113456"

jobs:

  # ============================================================
  # DESKTOP
  # FNF recommends verifying the desktop build before Android.
  # ============================================================

  desktop:
    name: Desktop - Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: ~/.haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('hmm.json', 'haxelib.json', 'project.xml') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-

      - name: Install HMM
        run: |
          haxelib install hmm
          haxelib run hmm install

      # --------------------------------------------------------
      # Lime
      #
      # IMPORTANT:
      # Do not use a Git-only Lime checkout here.
      # The packaged Haxelib release contains lime.ndll.
      # --------------------------------------------------------

      - name: Install packaged Lime
        run: |
          haxelib install lime

          LIME_VERSION="$(haxelib list | awk '/^lime:/{print $2}' | head -n 1 | tr -d '[]')"

          if [ -n "$LIME_VERSION" ]; then
            haxelib set lime "$LIME_VERSION"
          fi

      - name: Verify Lime
        run: |
          haxelib list
          haxelib run lime version

      - name: Setup Lime
        run: |
          haxelib run lime setup -y

      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild cpp -64
          haxelib run lime rebuild hxcpp

      - name: Build Linux
        run: |
          haxelib run lime test linux -release

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Crystal-Linux
          path: export/linux/bin/**
          if-no-files-found: warn


  # ============================================================
  # ANDROID
  #
  # Based on the Android section of the FNF mobile guide.
  # ============================================================

  android:
    name: Android
    runs-on: ubuntu-22.04

    needs:
      - desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --------------------------------------------------------
      # JDK 17
      # --------------------------------------------------------

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # --------------------------------------------------------
      # Haxe
      # --------------------------------------------------------

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      # --------------------------------------------------------
      # Android command-line tools
      # --------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------------
      # Android SDK / NDK versions from FNF guide
      # --------------------------------------------------------

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "platforms;android-${ANDROID_MIN_PLATFORM}" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "platform-tools"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # --------------------------------------------------------
      # Android environment
      # --------------------------------------------------------

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}" >> "$GITHUB_ENV"

          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------------
      # Haxelib cache
      # --------------------------------------------------------

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: ~/.haxelib
          key: ${{ runner.os }}-android-haxelib-${{ hashFiles('hmm.json', 'haxelib.json', 'project.xml') }}
          restore-keys: |
            ${{ runner.os }}-android-haxelib-

      # --------------------------------------------------------
      # Project dependencies
      # --------------------------------------------------------

      - name: Install HMM
        run: |
          haxelib install hmm
          haxelib run hmm install

      # --------------------------------------------------------
      # Lime
      #
      # Install the packaged Haxelib release so lime.ndll exists.
      # --------------------------------------------------------

      - name: Install packaged Lime
        run: |
          haxelib install lime

          LIME_VERSION="$(haxelib list | awk '/^lime:/{print $2}' | head -n 1 | tr -d '[]')"

          if [ -n "$LIME_VERSION" ]; then
            haxelib set lime "$LIME_VERSION"
          fi

      - name: Verify Lime
        run: |
          haxelib list
          haxelib run lime version

      # --------------------------------------------------------
      # Lime Android setup
      #
      # Equivalent to:
      # lime setup android
      #
      # The Android SDK/NDK/JDK are already configured above.
      # --------------------------------------------------------

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android -y

      # --------------------------------------------------------
      # Build Lime native components
      # --------------------------------------------------------

      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild hxcpp
          haxelib run lime rebuild android

      # --------------------------------------------------------
      # Build Android
      #
      # Equivalent to:
      # lime test android
      # --------------------------------------------------------

      - name: Build Android
        run: |
          haxelib run lime test android -release

      # --------------------------------------------------------
      # Upload APK/AAB
      # --------------------------------------------------------

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Crystal-Android
          path: |
            export/android/bin/**/*.apk
            export/android/bin/**/*.aab
          if-no-files-found: warn


  # ============================================================
  # HTML5
  # ============================================================

  html5:
    name: HTML5
    runs-on: ubuntu-22.04

    needs:
      - desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: ~/.haxelib
          key: ${{ runner.os }}-html5-haxelib-${{ hashFiles('hmm.json', 'haxelib.json', 'project.xml') }}
          restore-keys: |
            ${{ runner.os }}-html5-haxelib-

      - name: Install HMM
        run: |
          haxelib install hmm
          haxelib run hmm install

      - name: Install packaged Lime
        run: |
          haxelib install lime

          LIME_VERSION="$(haxelib list | awk '/^lime:/{print $2}' | head -n 1 | tr -d '[]')"

          if [ -n "$LIME_VERSION" ]; then
            haxelib set lime "$LIME_VERSION"
          fi

      - name: Setup Lime
        run: |
          haxelib run lime setup -y

      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild hxcpp

      - name: Build HTML5
        run: |
          haxelib run lime test html5 -release

      - name: Upload HTML5 build
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Crystal-HTML5
          path: export/html5/bin/**
          if-no-files-found: warn

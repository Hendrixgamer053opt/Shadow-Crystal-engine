name: Shadow Crystal - Build

on:
  workflow_dispatch:
    inputs:
      build-defines:
        type: string
        description: Haxe/Lime defines
        default: -DGITHUB_BUILD
        required: false
      save-artifact:
        type: boolean
        description: Upload builds as GitHub Actions artifacts
        default: true
  push:

permissions:
  contents: read

jobs:
  build-desktop-web:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux, html5]
    defaults:
      run:
        shell: bash
    env:
      BUILD_DEFINES: ${{ github.event.inputs.build-defines || '-DGITHUB_BUILD' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install HMM
        run: |
          haxelib --global git haxelib https://github.com/FunkinCrew/haxelib.git
          haxelib --global git hmm https://github.com/FunkinCrew/hmm.git
          haxelib --global run hmm install -q
          haxelib --global fixrepo

      - name: Setup Lime
        run: |
          haxelib run lime setup -y
          haxelib run lime rebuild hxcpp
          haxelib run lime rebuild cpp -64

      - name: Build
        run: |
          haxelib run lime build ${{ matrix.target }} -v -release --times $BUILD_DEFINES
        timeout-minutes: 120

      - name: Upload artifact
        if: ${{ github.event.inputs.save-artifact != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: shadow-crystal-${{ matrix.target }}
          path: export/release/${{ matrix.target }}/bin/
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      BUILD_DEFINES: ${{ github.event.inputs.build-defines || '-DGITHUB_BUILD' }}
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.0
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
          log-accepted-android-sdk-licenses: false

      - name: Export Android paths
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install HMM
        run: |
          haxelib --global git haxelib https://github.com/FunkinCrew/haxelib.git
          haxelib --global git hmm https://github.com/FunkinCrew/hmm.git
          haxelib --global run hmm install -q
          haxelib --global fixrepo

      - name: Setup Lime for Android
        run: |
          haxelib run lime setup -y
          haxelib run lime rebuild hxcpp
          haxelib run lime rebuild android

      - name: Build Android
        run: |
          haxelib run lime build android -v -release --times $BUILD_DEFINES
        timeout-minutes: 180

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-crystal-android
          path: |
            export/release/android/bin/**/*.apk
            export/release/android/bin/**/*.aab
          if-no-files-found: error
